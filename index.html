<title>電子喜帖 — 序</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&amp;family=Noto+Sans+TC:wght@300;400;500&amp;family=Ma+Shan+Zheng&amp;family=Zhi+Mang+Xing&amp;family=Long+Cang&amp;family=Liu+Jian+Mao+Cao&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Playfair+Display:ital@0;1&amp;family=Dancing+Script&amp;family=Great+Vibes&amp;display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0b0c10; --cream:#f3ead9; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; overflow:hidden; background:var(--navy); color:var(--cream); font-family:'Noto Serif TC', serif; overscroll-behavior:none; }
  body{ touch-action:none; }
  #stage{ position:fixed; inset:0; overflow:hidden; background:var(--navy); container-type:inline-size; }
  #bg{ position:absolute; left:0; top:0; width:100%; height:auto; display:block; will-change:transform; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  #textLayer{ position:absolute; inset:0; z-index:5; }
  #animLayer{ position:absolute; left:0; top:0; width:100%; z-index:2; pointer-events:none; will-change:transform; }
  .anim{ position:absolute; opacity:0; transition:opacity 1s ease; }
  .anim.on{ opacity:1; }
  .anim .pt{ position:absolute; display:block; }
  .anim .pt b{ display:block; width:100%; height:100%; border-radius:100% 0 100% 0; opacity:.85; animation:psway var(--t) ease-in-out var(--dl) infinite alternate; }
  .anim .pt.dot b{ border-radius:50%; filter:blur(.3px); }
  .anim .tw{ position:absolute; display:block; border-radius:50%; background:radial-gradient(circle,var(--c) 0,var(--c) 22%,transparent 70%); opacity:0; }
  .anim .gl{ position:absolute; inset:0; background:radial-gradient(closest-side,var(--c),transparent); mix-blend-mode:screen; opacity:.25; }
  @keyframes pfall{ 0%{top:-8%;opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{top:104%;opacity:0} }
  @keyframes prise{ 0%{top:104%;opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{top:-8%;opacity:0} }
  @keyframes psway{ from{transform:translateX(calc(var(--sw)*-1)) rotate(-35deg)} to{transform:translateX(var(--sw)) rotate(35deg)} }
  @keyframes ptw{ 0%,100%{opacity:0;transform:scale(.3)} 50%{opacity:1;transform:scale(1)} }
  @keyframes gpulse{ 0%,100%{opacity:.2;transform:scale(.92)} 50%{opacity:var(--str);transform:scale(1.06)} }
  .anim .mt{ position:absolute; left:100%; top:0; width:0; height:0; transform-origin:0 0; opacity:0; }
  .anim .mt b{ display:block; position:absolute; right:0; top:calc(var(--th)*-.35); border-radius:2px; background:linear-gradient(90deg,transparent,var(--c)); }
  .anim .mt b::after{ content:''; position:absolute; right:-1px; top:50%; width:calc(var(--th)*2); height:calc(var(--th)*2); margin-top:calc(var(--th)*-1); border-radius:50%; background:var(--c); box-shadow:0 0 8px 2px var(--c); }
  .anim .gp{ position:absolute; display:block; border-radius:50%; background:radial-gradient(circle,var(--c) 0,var(--c) 18%,transparent 68%); opacity:0; }
  .anim .gh{ position:absolute; inset:0; border-radius:50%; background:radial-gradient(closest-side,var(--c),transparent); mix-blend-mode:screen; }
  @keyframes gtw{ 0%,100%{opacity:0;transform:scale(.35)} 50%{opacity:var(--str);transform:scale(1)} }
  @keyframes swy{ from{transform:rotate(calc(var(--a)*-1)) skewX(calc(var(--a)*-.6))} to{transform:rotate(var(--a)) skewX(calc(var(--a)*.6))} }
  @keyframes drf{ from{transform:translateX(calc(var(--d)*-1))} to{transform:translateX(var(--d))} }
  .cap{ position:absolute; transform:translate(-50%,0); opacity:0; white-space:pre-wrap; word-break:break-word; color:var(--cream);
    text-shadow:0 2px 18px rgba(0,0,0,.5), 0 0 3px rgba(0,0,0,.35); pointer-events:none; transition-property:opacity; transition-timing-function:ease; transition-duration:1.2s; }
  .cap.in{ opacity:1; }
  #flowLayer{ position:absolute; inset:0; z-index:6; pointer-events:none; }
  .cap.flow{ transition:none; }
  .cap.out{ opacity:0; }
  #goBtn{ position:absolute; left:50%; bottom:max(18px, env(safe-area-inset-bottom)); transform:translate(-50%,8px); z-index:20; opacity:0; pointer-events:none;
    font:400 12px/1 'Noto Sans TC',sans-serif; letter-spacing:.18em; color:var(--cream); text-decoration:none; padding:9px 18px; border:1px solid rgba(243,234,217,.6); border-radius:999px;
    background:rgba(18,24,42,.35); backdrop-filter:blur(4px); transition:opacity 1s ease, transform 1s ease; }
  #goBtn.show{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  #goBtn{ display:none !important; }
  #skipLink{ position:absolute; top:calc(24px*var(--inv,1)); right:calc(26px*var(--inv,1)); z-index:70; font:400 calc(12pt*var(--inv,1))/1 'Noto Serif TC',serif; letter-spacing:.15em; white-space:nowrap; color:var(--cream); opacity:.8; text-decoration:none; text-shadow:0 1px 10px rgba(18,10,4,.85), 0 0 3px rgba(18,10,4,.6); }
  #skipLink:hover{ opacity:1; }
  #credit{ position:absolute; left:0; right:0; bottom:calc(10px*var(--inv,1)); z-index:30; transition:opacity .9s ease; text-align:center; font:400 calc(12pt*var(--inv,1))/1.4 'Noto Serif TC',serif; letter-spacing:.12em; white-space:nowrap; color:#d4a892; opacity:0; pointer-events:none; text-shadow:0 1px 6px rgba(90,30,20,.3); }
  #hint{ position:absolute; left:50%; top:50%; width:calc(30px*var(--inv,1)); margin-left:calc(-15px*var(--inv,1)); transform:translateY(-50%); z-index:30; opacity:0; pointer-events:none; }
  #hint img{ width:100%; height:auto; display:block; filter:drop-shadow(0 0 5px rgba(246,233,216,.55)); }
  #hint.go{ animation:hintBlink 1.3s ease-in-out 2 both; }
  @keyframes hintBlink{ 0%,100%{opacity:0} 40%,60%{opacity:.9} }
  #fade{ position:fixed; inset:0; z-index:100; background:linear-gradient(180deg,#ae6d53,#f3ead9); opacity:0; pointer-events:none; transition:opacity .9s ease; }
  #fade.show{ opacity:1; }
</style>
