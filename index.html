<html lang="zh-Hant"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yutse &amp; ciaowei's wedding invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&amp;family=Noto+Serif+TC:wght@300;400;500;600&amp;family=Noto+Sans+TC:wght@300;400;500&amp;family=Ma+Shan+Zheng&amp;family=Zhi+Mang+Xing&amp;family=Long+Cang&amp;family=Liu+Jian+Mao+Cao&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&amp;family=Playfair+Display:ital@0;1&amp;family=Dancing+Script&amp;family=Great+Vibes&amp;display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0b0c10; --cream:#f3ead9; }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; overflow:hidden; background:var(--navy); color:var(--cream); font-family:'Noto Serif TC', serif; overscroll-behavior:none; }
  body{ touch-action:none; }
  #stage{ position:fixed; inset:0; overflow:hidden; background:var(--navy); container-type:inline-size; }
  #bg{ position:absolute; left:0; top:0; width:100%; height:auto; display:block; will-change:transform; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  #textLayer{ position:absolute; inset:0; z-index:5; }
  #animLayer{ position:absolute; left:0; top:0; width:100%; z-index:2; pointer-events:none; will-change:transform; }
  .anim{ position:absolute; opacity:0; transition:opacity 1s ease; }
  .anim.on{ opacity:1; }
  .anim .pt{ position:absolute; display:block; }
  .anim .pt b{ display:block; width:100%; height:100%; border-radius:100% 0 100% 0; opacity:.85; animation:psway var(--t) ease-in-out var(--dl) infinite alternate; }
  .anim .pt.dot b{ border-radius:50%; filter:blur(.3px); }
  .anim .tw{ position:absolute; display:block; border-radius:50%; background:radial-gradient(circle,var(--c) 0,var(--c) 22%,transparent 70%); opacity:0; }
  .anim .gl{ position:absolute; inset:0; background:radial-gradient(closest-side,var(--c),transparent); mix-blend-mode:screen; opacity:.25; }
  @keyframes pfall{ 0%{top:-8%;opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{top:104%;opacity:0} }
  @keyframes prise{ 0%{top:104%;opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{top:-8%;opacity:0} }
  @keyframes psway{ from{transform:translateX(calc(var(--sw)*-1)) rotate(-35deg)} to{transform:translateX(var(--sw)) rotate(35deg)} }
  @keyframes ptw{ 0%,100%{opacity:0;transform:scale(.3)} 50%{opacity:1;transform:scale(1)} }
  @keyframes gpulse{ 0%,100%{opacity:.2;transform:scale(.92)} 50%{opacity:var(--str);transform:scale(1.06)} }
  .anim .mt{ position:absolute; left:100%; top:0; width:0; height:0; transform-origin:0 0; opacity:0; }
  .anim .mt b{ display:block; position:absolute; right:0; top:calc(var(--th)*-.35); border-radius:2px; background:linear-gradient(90deg,transparent,var(--c)); }
  .anim .mt b::after{ content:''; position:absolute; right:-1px; top:50%; width:calc(var(--th)*2); height:calc(var(--th)*2); margin-top:calc(var(--th)*-1); border-radius:50%; background:var(--c); box-shadow:0 0 8px 2px var(--c); }
  .anim .gp{ position:absolute; display:block; border-radius:50%; background:radial-gradient(circle,var(--c) 0,var(--c) 18%,transparent 68%); opacity:0; }
  .anim .gh{ position:absolute; inset:0; border-radius:50%; background:radial-gradient(closest-side,var(--c),transparent); mix-blend-mode:screen; }
  @keyframes gtw{ 0%,100%{opacity:0;transform:scale(.35)} 50%{opacity:var(--str);transform:scale(1)} }
  @keyframes swy{ from{transform:rotate(calc(var(--a)*-1)) skewX(calc(var(--a)*-.6))} to{transform:rotate(var(--a)) skewX(calc(var(--a)*.6))} }
  @keyframes drf{ from{transform:translateX(calc(var(--d)*-1))} to{transform:translateX(var(--d))} }
  .cap{ position:absolute; transform:translate(-50%,0); opacity:0; white-space:pre-wrap; word-break:break-word; color:var(--cream);
    text-shadow:0 2px 18px rgba(0,0,0,.5), 0 0 3px rgba(0,0,0,.35); pointer-events:none; transition-property:opacity; transition-timing-function:ease; transition-duration:1.2s; }
  .cap.in{ opacity:1; }
  #flowLayer{ position:absolute; inset:0; z-index:6; pointer-events:none; }
  .cap.flow{ transition:none; }
  .cap.out{ opacity:0; }
  #goBtn{ position:absolute; left:50%; bottom:max(18px, env(safe-area-inset-bottom)); transform:translate(-50%,8px); z-index:20; opacity:0; pointer-events:none;
    font:400 12px/1 'Noto Sans TC',sans-serif; letter-spacing:.18em; color:var(--cream); text-decoration:none; padding:9px 18px; border:1px solid rgba(243,234,217,.6); border-radius:999px;
    background:rgba(18,24,42,.35); backdrop-filter:blur(4px); transition:opacity 1s ease, transform 1s ease; }
  #goBtn.show{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }
  #goBtn{ display:none !important; }
  #skipLink{ position:absolute; top:calc(12px*var(--inv,1)); right:calc(14px*var(--inv,1)); z-index:70; font:italic 400 calc(13pt*var(--inv,1))/1 'Cormorant Garamond','Times New Roman',serif; letter-spacing:.14em; white-space:nowrap; color:var(--cream); opacity:.8; text-decoration:none; text-shadow:0 1px 10px rgba(18,10,4,.85), 0 0 3px rgba(18,10,4,.6); }
  #skipLink:hover{ opacity:1; }
  #credit{ position:absolute; inset:0; z-index:30; transition:opacity 1.8s ease; opacity:0; pointer-events:none; }
  #credit .crt{ transition:opacity .9s ease; opacity:0; }
  #credit .nmL{ left:23.1%; height:19.88%; } #credit .nmR{ left:75.8%; height:17.28%; }
  #credit .crt{ position:absolute; left:0; right:0; bottom:calc(10px*var(--inv,1)); text-align:center; font:400 calc(12pt*var(--inv,1))/1.4 'Noto Serif TC',serif; letter-spacing:.12em; white-space:nowrap; color:#d4a892; pointer-events:none; text-shadow:0 1px 6px rgba(90,30,20,.3); }
  #credit .nmG{ position:absolute; top:54.9%; transform:translate(-50%,-50%); width:auto; display:block; }
  #credit .nmG img{ height:100%; width:auto; max-width:none; max-height:none; display:block; }
  
  #hint{ position:absolute; left:50%; top:50%; width:calc(30px*var(--inv,1)); margin-left:calc(-15px*var(--inv,1)); transform:translateY(-50%); z-index:30; opacity:0; pointer-events:none; }
  #hint img{ width:100%; height:auto; display:block; filter:drop-shadow(0 0 5px rgba(246,233,216,.55)); }
  #hint.go{ animation:hintBlink 1.3s ease-in-out 2 both; }
  @keyframes hintBlink{ 0%,100%{opacity:0} 40%,60%{opacity:.9} }
  #fade{ position:fixed; inset:0; z-index:100; background:#987055; opacity:0; pointer-events:none; transition:opacity .9s ease; }
  #fade.show{ opacity:1; }
</style>

  function tick(ts){

    if(state==='gap'){
      const s=gst; s.t+=dt*rate*s.dir; const done=s.dir>0?s.t>=s.D:s.t<=0, tt=Math.max(0,Math.min(s.D,s.t));
      p=s.G.lo+(s.G.hi-s.G.lo)*PA.progAt(s.tb,tt/s.D); apply(); setFlowT(s.G.after,tt); btn.classList.remove('show'); animObjs.forEach(o=>{ const d=o.d; if(d.mode!=='gap'||(d.gap||'_')!==s.G.key) return; const v=PA.flowVal({at:d.at,dur:d.fi,off:d.dur>0?d.at+d.dur:s.D,out:d.fo},tt); if(v>0&&!o.fired){ o.fired=true; if(o.el._restart) o.el._restart(); } o.el.style.opacity=v.toFixed(3); }); updScroll(); if(done) endGap(); return;

  PA.play=function(from,after,autoGap){

  PA.stop=function(){ freeMode=false; setCr(0); hintEl.classList.remove('go'); hintEl._done=false; animObjs.forEach(o=>{ setOn(o,false,0); o.el.style.opacity=''; }); flowObjs.forEach(o=>o.el.style.opacity=0); clearT(); cancelAnimationFrame(raf); raf=null; state='free'; layer.innerHTML=''; btn.classList.remove('show'); };
  window.addEventListener('resize',()=>{ if(PA.inputOn&&raf) PA.setBg(p); });
  window.addEventListener('wheel',e=>{ if(!PA.inputOn) return; e.preventDefault(); if(freeMode){ target=clamp100(target+e.deltaY*(e.deltaMode===1?16:1)/sc()/PA.range()*100); return; } if(state!=='free'){ boost(Math.abs(e.deltaY)/250); } const now=performance.now(), fresh=now-lastW>150; lastW=now; if(fresh){ acc=0; used=false; } if(used) return; if(state!=='free'){ used=true; return; }

  function goB(href){ if(PA._going) return; PA._going=true; const t0=Date.now(); fade.classList.add('show');

  // ===== 音樂引擎（Web Audio：手機也能控制延遲、起點、淡入淡出、音量）=====
  const MU={ ctx:null, buf:null, src:null, gain:null, loading:null, began:false, stopped:false, t0:0, startWhen:0, vol:1, status:'idle',
    cfg(){ return Object.assign({delay:7,start:0,fadeIn:2,fadeOut:1.5,volume:100,url:'bgm.mp3'},(S().music)||{}); },
    unlock(){ try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC){ this.status='nosupport'; return false; }

  PA.fit=function(){ const f=(S().frame||'').split('x').map(Number); if(f.length!==2||!f[0]||!f[1]) return; const W=f[0],H=f[1], s=Math.min(innerWidth/W,innerHeight/H); stage.style.cssText='inset:auto;left:'+((innerWidth-W*s)/2)+'px;top:'+((innerHeight-H*s)/2)+'px;width:'+W+'px;height:'+H+'px;transform:scale('+s+');transform-origin:0 0;'; stage.style.setProperty('--inv',(1/s).toFixed(4)); };
